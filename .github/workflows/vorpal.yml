name: Vorpal full-repo scan

on:
  push:
    branches:
      - "**"
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  vorpal:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0    # optional: full history if any tools need it

      - name: Run Vorpal with reviewdog (full repo)
        uses: checkmarx/vorpal-reviewdog-github-action@v1.2.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          source_path: '.'                 # scan whole repo
          reporter: github-pr-check        # or github-pr-review for review comments
          level: error
          filter_mode: nofilter            # scanning all files, so don't filter
          fail_on_error: false
