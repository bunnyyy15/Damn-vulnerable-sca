name: Vorpal full-repo scan

on:
  push:
    branches:
      - "**"
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  vorpal:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      # Get ALL files in the repo, not only changed ones
      - name: Get all files in repo
        id: all-files
        uses: tj-actions/changed-files@v46.0.1
        with:
          files: "**/*"
          separator: ','

      - name: Run Vorpal (full repo)
        uses: checkmarx/vorpal-reviewdog-github-action@v1.2.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          source_path: ${{ steps.all-files.outputs.all_files }}
          reporter: github-pr-check
          level: error
          filter_mode: nofilter
          fail_on_error: false
