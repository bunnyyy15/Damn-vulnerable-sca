name: 2MS Secret Scan (annotate PR)

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches:
      - main
      - master

jobs:
  secret_detection:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run 2MS (Docker) - git scan
        run: |
          docker run --rm -v "$PWD":/repo checkmarx/2ms \
          git /repo \
          --stdout-format json \
          --report-path /repo/artifacts/2ms.json \
          --ignore-on-exit results

      - name: Show summary (for logs)
        run: |
          if [ -f 2ms-report.json ]; then
            jq '.findings | length as $n | "Findings: \($n)"' 2ms-report.json || true
            jq '.findings | .[] | {rule: .rule, file: .file, line: .line, match: .match}' 2ms-report.json | sed -n '1,200p' || true
          else
            echo "No report found"
          fi

      - name: Post PR comment with summary (if findings)
        if: always()
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const path = './2ms-report.json';
            if (!fs.existsSync(path)) {
              core.info('No 2ms report found');
              return;
            }
            const report = JSON.parse(fs.readFileSync(path, 'utf8'));
            const findings = report.findings || [];
            const short = findings.slice(0,10).map(f => `- \`${f.rule}\` in \`${f.file}\` (line ${f.line})`).join("\n") || "No findings";
            const body = `**2MS secret scan results**\n\nFindings: **${findings.length}**\n\n${short}\n\n(Full report attached as artifact)`;
            const pr = context.payload.pull_request;
            if (pr) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: pr.number,
                body
              });
            } else {
              core.info('Not a PR event; skipping comment');
            }

      - name: Upload 2MS report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: 2ms-report
          path: 2ms-report.json

      - name: Fail if secrets found
        if: always()
        run: |
          count=$(jq '.findings | length' 2ms-report.json || echo 0)
          echo "Findings count: $count"
          if [ "$count" -gt 0 ]; then
            echo "Secrets found -> failing job"
            exit 1
          fi
